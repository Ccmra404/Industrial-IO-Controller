name: Bug 报告
description: 报告硬件、固件、文档或工具中的问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        提交前请确认问题可以复现。涉及电源、负载或现场设备时，请勿上传包含敏感信息的照片或日志。
  - type: input
    id: version
    attributes:
      label: 硬件/固件版本
      description: 请填写板卡版本、固件版本或文档提交号；不适用时填写 N/A。
      placeholder: "HW-x.y / FW-x.y"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 问题所属模块
      options:
        - 硬件原理图
        - PCB
        - 电源与保护
        - IO 功能
        - 通信接口
        - 固件
        - 测试
        - 文档/工具
        - 其他
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: 问题描述
      description: 清楚说明实际发生了什么。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤与测试条件
      description: 包括接线、供电、负载、配置和操作步骤。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果与实际结果
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 日志、波形或照片
      description: 请脱敏后提供，并标注仪器、量程和测量位置（如适用）。
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 已搜索现有 Issues，未发现重复问题。
          required: true
        - label: 已移除密码、令牌、个人信息等敏感内容。
          required: true
